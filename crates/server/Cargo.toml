[package]
name = "tendly-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tendly-domain.workspace = true
tendly-persistence.workspace = true
tendly-runtime.workspace = true
axum.workspace = true
chrono.workspace = true
futures-util.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
sha2.workspace = true
image.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
indexmap = "2"
url = "2"
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "disk", "network", "component"] }
dunce = "1"
notify = "8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rquickjs = { version = "0.11", features = ["parallel"] }

hyper = "1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
# A paused clock, for the model-list cache tests.
tokio = { workspace = true, features = ["test-util"] }
