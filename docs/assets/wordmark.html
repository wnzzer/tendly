<!doctype html><html><head><meta charset="utf-8">
<!-- Source of docs/assets/wordmark-{light,dark}.png, the README header: the app
     mark and the name on a transparent background. Rendered with the banner by
     scripts/render-banner.mjs, swapping THEME for light / dark. -->
<style>
@font-face{font-family:"Instrument Sans";src:url(FONT_DIR/instrument-sans/files/instrument-sans-latin-wght-normal.woff2) format("woff2");font-weight:400 700}
html,body{margin:0;padding:0;background:transparent}
body{font-family:"Instrument Sans",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{display:inline-flex;align-items:center;gap:26px;padding:16px 20px 22px}
.mark{position:relative;width:104px;height:104px;border-radius:28px;background:linear-gradient(150deg,var(--accent-hi) 0%,var(--accent) 55%,var(--accent-lo) 100%);box-shadow:0 14px 28px -12px var(--mark-shadow),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.12)}
.mark svg{position:absolute;inset:0}
h1{margin:0;font-size:96px;line-height:1;font-weight:700;letter-spacing:-.045em;color:var(--ink)}
h1 span{color:var(--accent-ink)}
.light{--ink:#221f1b;--accent:#0f7f70;--accent-hi:#3fb7a4;--accent-lo:#0a5c51;--accent-ink:#0f7f70;--mark-shadow:rgba(15,127,112,.45)}
.dark{--ink:#ecebe8;--accent:#3fc4b0;--accent-hi:#8ae6d6;--accent-lo:#1d7f70;--accent-ink:#5ed2bf;--mark-shadow:rgba(0,0,0,.6)}
</style></head><body>
<div class="wrap THEME">
  <div class="mark"><svg viewBox="0 0 56 56" width="104" height="104"><g fill="#fff"><rect x="13" y="13" width="30" height="7.7" rx="3.85"/><rect x="24.15" y="13" width="7.7" height="31" rx="3.85"/></g></svg></div>
  <h1>Tend<span>ly</span></h1>
</div></body></html>
