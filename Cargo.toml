[workspace]
members = [
  "crates/domain",
  "crates/persistence",
  "crates/agent-runtime",
  "crates/server",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.107"

[workspace.dependencies]
tendly-domain = { path = "crates/domain" }
tendly-persistence = { path = "crates/persistence" }
tendly-runtime = { path = "crates/agent-runtime" }
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
futures-util = "0.3"
libc = "0.2"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
rust-embed = { version = "8", features = ["interpolate-folder-path", "include-exclude", "compression"] }
mime_guess = "2"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "tga", "pnm", "qoi"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

# A release is downloaded by everyone who installs or updates, and the gateway
# spends its time waiting on agents and the network, not computing: size wins.
# Measured on aarch64-apple-darwin, 0.1.73: 26.7 MB → 10.7 MB.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
